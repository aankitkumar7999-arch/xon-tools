<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader — ToolsHub</title>
  <meta name="description" content="YouTube video aur audio free mein download karo — 4K, 2K, 1080p, 720p, MP3!" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <style>
    .tool-page { max-width: 820px; margin: 0 auto; padding: var(--space-xl); }

    .url-row { display: flex; gap: var(--space-sm); }
    .url-row .input { flex: 1; border-radius: var(--radius-full); }
    .url-row .btn   { flex-shrink: 0; }

    /* Video Preview */
    .video-preview { display:none; border-radius: var(--radius-xl); overflow:hidden;
                     background: var(--bg-card); border: 1px solid var(--border); margin-top: var(--space-lg); }
    .thumb-wrap    { position: relative; }
    .preview-thumb { width: 100%; max-height: 280px; object-fit: cover; display: block; }
    .thumb-duration{ position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8);
                     padding: 4px 10px; border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 700; }
    .preview-info  { padding: var(--space-lg); }
    .preview-title { font-size: 1.1rem; font-weight: 700; margin-bottom: var(--space-sm); line-height: 1.4; }
    .preview-meta  { display:flex; gap: var(--space-md); flex-wrap: wrap; }
    .meta-item     { font-size: 0.8rem; color: var(--text-muted); }

    /* Quality Categories */
    .quality-section { margin-top: var(--space-lg); }
    .quality-cat     { margin-bottom: var(--space-lg); }
    .quality-label   { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
                       text-transform: uppercase; color: var(--text-muted); margin-bottom: var(--space-sm); }

    .quality-grid    { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: var(--space-sm); }

    .q-btn {
      padding: 12px 10px; background: var(--bg-card); border: 1.5px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-secondary); font-size: 0.82rem;
      font-weight: 600; cursor: pointer; transition: all var(--transition-fast);
      text-align: center; font-family: var(--font-body); position: relative; overflow: hidden;
    }
    .q-btn:hover { border-color: var(--accent-purple); color: var(--accent-purple);
                   background: rgba(108,99,255,0.12); }
    .q-btn.selected { border-color: var(--accent-purple); color: var(--text-primary);
                      background: rgba(108,99,255,0.25); box-shadow: 0 0 20px rgba(108,99,255,0.2); }

    /* Quality badges */
    .q-badge { display: block; font-size: 1.1rem; font-weight: 800; margin-bottom: 2px; }
    .q-sub   { font-size: 0.7rem; color: var(--text-muted); font-weight: 400; }
    .q-btn.selected .q-sub { color: rgba(255,255,255,0.6); }

    /* Special quality colors */
    .q-4k    .q-badge { color: #FFD700; }
    .q-2k    .q-badge { color: #00FFA3; }
    .q-1080  .q-badge { color: var(--accent-cyan); }
    .q-720   .q-badge { color: var(--accent-purple); }
    .q-audio .q-badge { color: var(--accent-pink); }

    .download-row { display: flex; gap: var(--space-sm); margin-top: var(--space-lg); align-items: center; }
    .selected-info { flex: 1; font-size: 0.85rem; color: var(--text-muted); }
    .selected-info strong { color: var(--accent-cyan); }

    .progress-wrap { display: none; margin-top: var(--space-md); }
    .progress-bar  { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
                     border-radius: 4px; width: 0%; transition: width 0.3s ease;
                     animation: prog-shimmer 1.5s infinite; }
    @keyframes prog-shimmer { 0%,100%{opacity:1} 50%{opacity:0.7} }

    @media (max-width: 540px) { .url-row { flex-direction: column; } .download-row { flex-direction: column; } }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="../../index.html" class="nav-logo">
    <div class="logo-icon">🛠️</div><span>ToolsHub</span>
  </a>
  <a href="../../index.html" class="nav-back-btn">← Back to Home</a>
</nav>

<div class="tool-page">
  <div class="tool-header">
    <div class="tool-icon-big bg-youtube animate-float">📹</div>
    <h1>YouTube Downloader</h1>
    <p style="margin-top:8px;">4K · 2K · 1080p · 720p · 480p · 360p · MP3 — jo chahiye download karo!</p>
  </div>

  <div class="card animate-fadeInUp delay-1">
    <div class="url-row">
      <input type="url" id="yt-url" class="input"
             placeholder="https://www.youtube.com/watch?v=..."
             onkeydown="if(event.key==='Enter') fetchInfo()" />
      <button class="btn btn-primary" onclick="fetchInfo()" id="fetch-btn">🔍 Fetch</button>
    </div>
    <p style="font-size:0.78rem; color:var(--text-muted); margin-top: var(--space-sm);">
      💡 YouTube, YouTube Shorts, Playlists — supported!
    </p>
  </div>

  <!-- Video Preview -->
  <div class="video-preview animate-fadeInUp delay-2" id="video-preview">
    <div class="thumb-wrap">
      <img id="preview-thumb" class="preview-thumb" src="" alt="Thumbnail" />
      <span class="thumb-duration" id="preview-duration"></span>
    </div>
    <div class="preview-info">
      <div class="preview-title" id="preview-title"></div>
      <div class="preview-meta">
        <span class="meta-item">👁️ <span id="preview-views"></span> views</span>
        <span class="meta-item">👤 <span id="preview-channel"></span></span>
      </div>
    </div>
  </div>

  <!-- Quality Selector -->
  <div class="quality-section" id="quality-section" style="display:none;">

    <!-- Video Qualities -->
    <div class="quality-cat" id="cat-video">
      <div class="quality-label">🎬 Video Quality</div>
      <div class="quality-grid" id="grid-video"></div>
    </div>

    <!-- Audio Only -->
    <div class="quality-cat" id="cat-audio">
      <div class="quality-label">🎵 Audio Only</div>
      <div class="quality-grid" id="grid-audio"></div>
    </div>

    <!-- Download Bar -->
    <div class="download-row">
      <div class="selected-info" id="selected-info">👆 Upar se quality chuno</div>
      <button class="btn btn-primary" id="dl-btn" onclick="downloadVideo()" disabled>
        ⬇️ Download
      </button>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div style="display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-muted);margin-bottom:6px;">
        <span id="progress-label">Downloading...</span>
        <span id="progress-pct"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

</div>

<footer class="footer">
  <p>Made by <strong style="color:#F5A623">XON</strong> &nbsp;&middot;&nbsp; <a href="../../index.html">All Tools</a></p>
</footer>

<script src="../../assets/js/global.js"></script>
<script>
  let videoInfo    = null;
  let selectedFmt  = null;

  // Quality ordering map for sorting
  const Q_ORDER = { '4K':0, '2K':1, '1440p':2, '1080p':3, '720p':4, '480p':5, '360p':6, '240p':7, '144p':8 };
  const AUDIO_ORDER = { 'MP3': 0, 'M4A': 1, 'WEBM Audio': 2, 'OGG': 3 };

  function fmtDuration(sec) {
    if (!sec) return '';
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }
  function fmtViews(n) {
    if (!n) return '?';
    if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
    if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
    if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
    return n;
  }

  async function fetchInfo() {
    const url = document.getElementById('yt-url').value.trim();
    if (!url) { showToast('YouTube URL daalen pehle!', 'error'); return; }

    const btn = document.getElementById('fetch-btn');
    setLoading(btn, true);
    document.getElementById('quality-section').style.display = 'none';
    document.getElementById('video-preview').style.display   = 'none';

    try {
      const res  = await fetch(`${API_BASE}/youtube/info`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Fetch fail hua');

      videoInfo = data;
      renderPreview(data);
      renderQualities(data.formats || []);
      showToast('Video info mil gayi!', 'success');
    } catch(e) { showToast(e.message, 'error'); }
    finally { setLoading(btn, false); }
  }

  function renderPreview(d) {
    document.getElementById('preview-thumb').src    = d.thumbnail || '';
    document.getElementById('preview-title').textContent   = d.title || 'Unknown';
    document.getElementById('preview-duration').textContent= fmtDuration(d.duration);
    document.getElementById('preview-views').textContent   = fmtViews(d.view_count);
    document.getElementById('preview-channel').textContent = d.uploader || '';
    document.getElementById('video-preview').style.display = 'block';
  }

  function qualityLabel(fmt) {
    const h = fmt.height;
    if (h >= 2160) return '4K';
    if (h >= 1440) return '2K';
    if (h >= 1080) return '1080p';
    if (h >= 720)  return '720p';
    if (h >= 480)  return '480p';
    if (h >= 360)  return '360p';
    if (h >= 240)  return '240p';
    if (h)         return h+'p';
    return null;
  }

  function audioLabel(ext) {
    const map = { mp3:'MP3', m4a:'M4A', webm:'WEBM Audio', ogg:'OGG', opus:'OPUS' };
    return map[ext] || ext.toUpperCase();
  }

  function renderQualities(formats) {
    // Separate video + audio-only
    const videoFmts = [];
    const audioFmts = [];
    const seen = new Set();

    formats.forEach(f => {
      const lbl = f.label || '';
      const isAudio = lbl.toLowerCase().includes('audio') || (f.vcodec === 'none' || !f.height);
      if (isAudio) {
        // dedupe by ext
        const key = f.ext;
        if (!seen.has('a_'+key)) { seen.add('a_'+key); audioFmts.push(f); }
      } else {
        const qlbl = qualityLabel(f);
        if (qlbl && !seen.has(qlbl)) { seen.add(qlbl); videoFmts.push({...f, _qlbl: qlbl}); }
      }
    });

    // Sort video: 4K→144p
    videoFmts.sort((a,b) => (Q_ORDER[a._qlbl]??99) - (Q_ORDER[b._qlbl]??99));

    // Render video grid
    const vGrid = document.getElementById('grid-video');
    vGrid.innerHTML = '';
    if (videoFmts.length === 0) {
      vGrid.innerHTML = '<span style="color:var(--text-muted);font-size:0.82rem">Video formats nahi mile</span>';
    }
    videoFmts.forEach(f => {
      const ql = f._qlbl;
      const cls = ql === '4K' ? 'q-4k' : ql === '2K' ? 'q-2k' : ql === '1080p' ? 'q-1080' : 'q-720';
      const size = f.filesize ? ` · ${formatBytes(f.filesize)}` : '';
      const special = (ql === '4K' || ql === '2K') ? ' ⭐' : '';
      const btn = document.createElement('button');
      btn.className = `q-btn ${cls}`;
      btn.dataset.fmtId  = f.format_id;
      btn.dataset.label  = `${ql} Video (${f.ext.toUpperCase()})`;
      btn.innerHTML = `<span class="q-badge">${ql}${special}</span>
                       <span class="q-sub">${f.ext.toUpperCase()}${size}</span>`;
      btn.onclick = () => selectFmt(btn, f);
      vGrid.appendChild(btn);
    });

    // Render audio grid
    const aGrid = document.getElementById('grid-audio');
    aGrid.innerHTML = '';
    audioFmts.forEach(f => {
      const albl = audioLabel(f.ext);
      const size = f.filesize ? ` · ${formatBytes(f.filesize)}` : '';
      const btn  = document.createElement('button');
      btn.className = 'q-btn q-audio';
      btn.dataset.fmtId = f.format_id;
      btn.dataset.label = `${albl} Audio`;
      btn.innerHTML = `<span class="q-badge">🎵 ${albl}</span>
                       <span class="q-sub">Audio Only${size}</span>`;
      btn.onclick = () => selectFmt(btn, f);
      aGrid.appendChild(btn);
    });

    document.getElementById('quality-section').style.display = 'block';
    document.getElementById('dl-btn').disabled = true;
    selectedFmt = null;
    document.getElementById('selected-info').innerHTML = '👆 Upar se quality chuno';
  }

  function selectFmt(btn, fmt) {
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedFmt = fmt;
    selectedFmt.label = btn.dataset.label;
    document.getElementById('selected-info').innerHTML =
      `Selected: <strong>${btn.dataset.label}</strong>`;
    document.getElementById('dl-btn').disabled = false;
  }

  async function downloadVideo() {
    if (!selectedFmt) { showToast('Quality select karo pehle!', 'error'); return; }
    const url     = document.getElementById('yt-url').value.trim();
    const quality = selectedFmt.label;   // e.g. '1080p', 'M4A', 'WEBM Audio'
    const btn     = document.getElementById('dl-btn');
    setLoading(btn, true);

    // Show progress bar
    const pw = document.getElementById('progress-wrap');
    const pf = document.getElementById('progress-fill');
    pw.style.display = 'block'; pf.style.width = '0%';
    document.getElementById('progress-label').textContent = quality + ' download ho raha hai...';

    // Fake progress (server-side download, we can't track real %)
    let fakeP = 0;
    const fakeTimer = setInterval(() => {
      fakeP = Math.min(fakeP + Math.random() * 5, 90);
      pf.style.width = fakeP + '%';
    }, 600);

    try {
      const res = await fetch(`${API_BASE}/youtube/download`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ url, quality }),
      });

      clearInterval(fakeTimer);

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Download fail ho gaya');
      }

      pf.style.width = '95%';
      document.getElementById('progress-label').textContent = 'File taiyar — saving...';

      // Get filename from Content-Disposition header
      const cd       = res.headers.get('Content-Disposition') || '';
      const match    = cd.match(/filename="?([^"]+)"?/);
      const filename = match ? match[1] : `video_${quality}.mp4`;

      // Trigger browser download
      const blob    = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(blobUrl); a.remove(); }, 2000);

      pf.style.width = '100%';
      document.getElementById('progress-label').textContent = 'Download complete! ✅';
      showToast('Download ho gaya! 🎉', 'success');
      setTimeout(() => { pw.style.display = 'none'; }, 3000);

    } catch (e) {
      clearInterval(fakeTimer);
      pw.style.display = 'none';
      showToast(e.message || 'Download fail ho gaya', 'error');
    } finally {
      setLoading(btn, false);
    }
  }
</script>
</body>
</html>
