<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Picker — ToolsHub</title>
  <meta name="description" content="Beautiful color palettes banao. HEX, RGB, HSL convert karo. Designers ke liye perfect tool!" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <style>
    .tool-page { max-width: 820px; margin: 0 auto; padding: var(--space-xl); }
    .color-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); }

    .color-preview-big {
      height: 200px;
      border-radius: var(--radius-xl);
      transition: background-color 0.3s ease;
      margin-bottom: var(--space-md);
      display: flex;
      align-items: flex-end;
      padding: var(--space-md);
    }
    .hex-badge {
      padding: 6px 16px;
      background: rgba(0,0,0,0.4);
      border-radius: var(--radius-full);
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      backdrop-filter: blur(4px);
    }

    .color-picker-input {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: var(--radius-lg);
      cursor: pointer;
      background: none;
    }

    .convert-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-sm); }
    .convert-row  { display: flex; align-items: center; background: rgba(0,0,0,0.25); border: 1px solid var(--border);
                    border-radius: var(--radius-md); padding: 10px 14px; gap: var(--space-md); }
    .convert-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); min-width: 40px; }
    .convert-val   { flex: 1; font-family: monospace; font-size: 0.9rem; color: var(--accent-cyan); }
    .copy-mini     { cursor: pointer; font-size: 1rem; opacity: 0.6; transition: opacity var(--transition-fast); }
    .copy-mini:hover { opacity: 1; }

    .palette-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: var(--space-sm); margin-top: var(--space-md); }
    .swatch {
      height: 60px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: transform var(--transition-fast);
      border: 2px solid transparent;
    }
    .swatch:hover { transform: scale(1.1); border-color: rgba(255,255,255,0.3); }

    @media (max-width: 640px) { .color-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="../../index.html" class="nav-logo">
    <div class="logo-icon">🛠️</div><span>ToolsHub</span>
  </a>
  <a href="../../index.html" class="nav-back-btn">← Back to Home</a>
</nav>

<div class="tool-page">
  <div class="tool-header">
    <div class="tool-icon-big bg-color animate-float">🎨</div>
    <h1>Color Picker</h1>
    <p style="margin-top:8px;">Colors pick karo, convert karo aur beautiful palettes banao!</p>
  </div>

  <div class="color-layout animate-fadeInUp delay-1">

    <!-- Picker -->
    <div class="card">
      <div class="color-preview-big" id="color-preview" style="background:#6C63FF;">
        <span class="hex-badge" id="hex-badge">#6C63FF</span>
      </div>

      <div class="input-group">
        <label>Color Choose Karo</label>
        <input type="color" class="color-picker-input" id="color-picker" value="#6C63FF"
               oninput="updateColor(this.value)" />
      </div>

      <div class="input-group">
        <label>HEX Code Daalen</label>
        <input type="text" id="hex-input" class="input" value="#6C63FF" placeholder="#RRGGBB"
               oninput="if(this.value.match(/^#[0-9A-Fa-f]{6}$/)) updateColor(this.value)" />
      </div>
    </div>

    <!-- Values & Palette -->
    <div>
      <div class="card">
        <h4 style="margin-bottom: var(--space-md);">Color Values</h4>
        <div class="convert-grid">
          <div class="convert-row">
            <span class="convert-label">HEX</span>
            <span class="convert-val" id="val-hex">#6C63FF</span>
            <span class="copy-mini" onclick="copyToClipboard(document.getElementById('val-hex').textContent,'HEX copy!')">📋</span>
          </div>
          <div class="convert-row">
            <span class="convert-label">RGB</span>
            <span class="convert-val" id="val-rgb">rgb(108, 99, 255)</span>
            <span class="copy-mini" onclick="copyToClipboard(document.getElementById('val-rgb').textContent,'RGB copy!')">📋</span>
          </div>
          <div class="convert-row">
            <span class="convert-label">HSL</span>
            <span class="convert-val" id="val-hsl">hsl(243, 100%, 70%)</span>
            <span class="copy-mini" onclick="copyToClipboard(document.getElementById('val-hsl').textContent,'HSL copy!')">📋</span>
          </div>
          <div class="convert-row">
            <span class="convert-label">HSB</span>
            <span class="convert-val" id="val-hsb">hsb(243°, 61%, 100%)</span>
            <span class="copy-mini" onclick="copyToClipboard(document.getElementById('val-hsb').textContent,'HSB copy!')">📋</span>
          </div>
        </div>
      </div>

      <div class="card mt-md">
        <h4 style="margin-bottom: var(--space-md);">🎨 Color Palette</h4>
        <button class="btn btn-secondary btn-sm mb-md" onclick="generatePalette()">🔀 Generate Palette</button>
        <div class="palette-grid" id="palette-grid"></div>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <p>Made by <strong style="color:#F5A623">XON</strong> &nbsp;&middot;&nbsp; <a href="../../index.html">All Tools</a></p>
</footer>

<script src="../../assets/js/global.js"></script>
<script>
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }
  function rgbToHsl(r,g,b) {
    r/=255; g/=255; b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), l=(max+min)/2;
    let h,s;
    if(max===min){h=s=0;}
    else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
      switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}
      h/=6;}
    return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
  }
  function rgbToHsb(r,g,b) {
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b),v=max,d=max-min;
    const s=max===0?0:d/max;
    let h=0;
    if(max!==min){switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
    return {h:Math.round(h*360),s:Math.round(s*100),b:Math.round(v*100)};
  }

  function updateColor(hex) {
    if (!hex.match(/^#[0-9A-Fa-f]{6}$/)) return;
    const {r,g,b} = hexToRgb(hex);
    const hsl     = rgbToHsl(r,g,b);
    const hsb     = rgbToHsb(r,g,b);

    document.getElementById('color-preview').style.background = hex;
    document.getElementById('hex-badge').textContent = hex.toUpperCase();
    document.getElementById('color-picker').value    = hex;
    document.getElementById('hex-input').value       = hex.toUpperCase();
    document.getElementById('val-hex').textContent   = hex.toUpperCase();
    document.getElementById('val-rgb').textContent   = `rgb(${r}, ${g}, ${b})`;
    document.getElementById('val-hsl').textContent   = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
    document.getElementById('val-hsb').textContent   = `hsb(${hsb.h}°, ${hsb.s}%, ${hsb.b}%)`;

    generatePalette(hex);
  }

  function generatePalette(baseHex) {
    const hex    = baseHex || document.getElementById('color-picker').value;
    const {r,g,b}= hexToRgb(hex);
    const grid   = document.getElementById('palette-grid');
    grid.innerHTML = '';

    // Generate 10 shades + tints
    const steps = 10;
    for (let i = 0; i < steps; i++) {
      const t   = i / (steps - 1);
      const nr  = Math.round(r + (255 - r) * (1 - t));
      const ng  = Math.round(g + (255 - g) * (1 - t));
      const nb  = Math.round(b + (255 - b) * (1 - t));
      const swHex = `#${nr.toString(16).padStart(2,'0')}${ng.toString(16).padStart(2,'0')}${nb.toString(16).padStart(2,'0')}`;
      const sw  = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = swHex;
      sw.title = swHex.toUpperCase();
      sw.onclick = () => { updateColor(swHex); showToast(`${swHex.toUpperCase()} selected!`, 'success'); };
      grid.appendChild(sw);
    }
  }

  // Init
  updateColor('#6C63FF');
</script>
</body>
</html>
